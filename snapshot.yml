name: fpl-snapshot

on:
  schedule:
    - cron: "17 7 * * *"   # every day at 07:17 UTC, after FPL's overnight price changes
  workflow_dispatch:         # adds a "Run workflow" button for manual runs

permissions:
  contents: write            # lets the job commit the new data

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python src/snapshot.py
      - name: Commit new data
        run: |
          git config user.name "snapshot-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/raw
          git diff --cached --quiet || git commit -m "snapshot $(date -u +%F)"
          git push
